<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses — STUDY PREMIUM COURSE</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="nav"><div class="container" style="width:100%;display:flex;justify-content:space-between;align-items:center"><a class="brand" href="/">STUDY <span>PREMIUM COURSE</span></a><nav class="navlinks"><a href="account.html">My Account</a><a href="admin.html">Admin</a></nav></div></header><main class="section"><div class="container"><h1>All Courses</h1><p class="muted">Choose your branch and semester batch.</p><div style="display:flex;gap:10px;margin:20px 0"><input id="search" class="input" placeholder="Search course..."></div><div id="courses" class="grid"></div></div></main><div class="toast"></div><script src="/assets/app.js"></script><script>loadCourses(document.querySelector('#courses'));document.querySelector('#search').oninput=async e=>{const q=e.target.value.toLowerCase();const cs=await api('/api/courses');const el=document.querySelector('#courses');el.innerHTML=cs.filter(c=>(c.title+' '+c.branch+' '+c.semester).toLowerCase().includes(q)).map(c=>`<article class="card"><div class="thumb">${esc(c.branch)} • ${esc(c.semester)}</div><div class="cardbody"><span class="pill">${esc(c.batch)} Batch</span><h3>${esc(c.title)}</h3><p class="muted">${esc(c.description||'')}</p><div class="row"><span class="price">₹${c.price}</span><a class="btn" href="course.html?id=${c._id}">View</a></div></div></article>`).join('')}</script></body></html>
