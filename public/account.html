<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="nav"><div class="container" style="width:100%"><a class="brand" href="/">STUDY <span>PREMIUM COURSE</span></a></div></header><main class="section"><div class="container"><h1>My Account</h1><div class="hero-card"><form id="login" class="form"><input class="input" name="name" placeholder="Name" required><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="mobile" placeholder="Mobile"><button class="btn">Continue</button></form><div id="status" style="margin-top:20px"></div></div><section class="section"><h2>My Courses</h2><div id="courses" class="grid"></div></section><section class="section"><h2>My Orders</h2><div id="orders" class="content-list"></div></section></div></main><script src="/assets/app.js"></script><script>async function refresh(){try{const me=await api('/api/me');document.querySelector('#status').innerHTML='<div class="notice">Logged in as '+esc(me.user.name)+' • '+esc(me.user.email)+'</div>';const cs=await api('/api/my-courses');document.querySelector('#courses').innerHTML=cs.map(x=>`<article class="card"><div class="cardbody"><span class="pill">APPROVED</span><h3>${esc(x.course.title)}</h3><a class="btn" href="content.html?course=${x.course._id}">Open Content</a></div></article>`).join('')||'<p class="muted">No approved courses yet.</p>';const os=await api('/api/orders/mine');document.querySelector('#orders').innerHTML=os.map(o=>`<div class="content-item"><b>${esc(o.course.title)}</b><br>UTR: ${esc(o.utr)}<br><span class="status ${o.status}">${o.status}</span></div>`).join('')}catch(e){document.querySelector('#status').innerHTML='<div class="notice">Please enter your details to continue.</div>'}}document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/user',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});refresh()}catch(err){alert(err.message)}};refresh()</script></body></html>
