<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — STUDY PREMIUM COURSE</title><link rel="stylesheet" href="/assets/style.css"></head><body><div id="app"><div class="admin-shell"><aside class="sidebar"><div class="brand">STUDY <span>PREMIUM</span></div><a class="active" href="#dashboard">Dashboard</a><a href="#courses">Courses</a><a href="#content">Videos / PDFs</a><a href="#payments">Payments</a><a href="/">Website</a></aside><main class="admin-main"><div id="login"><div class="hero-card" style="max-width:520px;margin:50px auto"><h1>Admin Login</h1><form id="loginForm" class="form"><input class="input" name="email" type="email" placeholder="Admin email" required><input class="input" name="password" type="password" placeholder="Password" required><button class="btn">Login</button></form></div></div><div id="dash" style="display:none"><div class="row"><div><h1>Admin Dashboard</h1><p class="muted">Manage courses, media and payment approvals.</p></div></div><div id="stats" class="admin-grid"></div><section id="payments" class="section"><div class="section-head"><h2>Payment Approvals</h2></div><div class="card" style="padding:10px;overflow:auto"><table class="table"><thead><tr><th>User</th><th>Course</th><th>UTR</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div></section><section id="courses" class="section"><h2>Courses</h2><form id="courseForm" class="form" style="margin:15px 0"><input class="input" name="title" placeholder="Course title" required><input class="input" name="branch" placeholder="Branch"><input class="input" name="semester" placeholder="Semester"><input class="input" name="batch" placeholder="Batch"><input class="input" name="price" type="number" placeholder="Price" required><textarea class="input" name="description" placeholder="Description"></textarea><button class="btn">Add Course</button></form><div id="courseRows" class="grid"></div></section><section id="content" class="section"><h2>Upload Video / PDF</h2><form id="contentForm" class="form" enctype="multipart/form-data"><select class="input" name="course" id="courseSelect" required></select><input class="input" name="subject" placeholder="Subject" required><input class="input" name="unit" placeholder="Unit 1"><input class="input" name="title" placeholder="Content title" required><select class="input" name="type"><option value="video">Video</option><option value="pdf">PDF</option><option value="link">External link</option></select><input class="input" name="externalUrl" placeholder="External URL (optional)"><input class="input" type="file" name="file"><button class="btn">Save Content</button></form></section></div></main></div></div><script src="/assets/app.js"></script><script>async function boot(){try{await api('/api/admin/me');showDash()}catch{document.querySelector('#login').style.display='block'}}function showDash(){document.querySelector('#login').style.display='none';document.querySelector('#dash').style.display='block';load()}document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});showDash()}catch(err){alert(err.message)}};async function load(){const s=await api('/api/admin/stats');document.querySelector('#stats').innerHTML=[['Courses',s.courses],['Users',s.users],['Pending',s.pending],['Revenue','₹'+s.revenue]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><br><b>${x[1]}</b></div>`).join('');const os=await api('/api/admin/orders');document.querySelector('#orders').innerHTML=os.map(o=>`<tr><td>${esc(o.user.name)}<br>${esc(o.user.email)}</td><td>${esc(o.course.title)}</td><td>${esc(o.utr)}</td><td>₹${o.amount}</td><td class="status ${o.status}">${o.status}</td><td>${o.status==='PENDING'?`<button class="btn" onclick="approve('${o._id}','APPROVED')">Approve</button> <button class="btn ghost" onclick="approve('${o._id}','REJECTED')">Reject</button>`:'—'}</td></tr>`).join('');const cs=await api('/api/admin/courses');document.querySelector('#courseRows').innerHTML=cs.map(c=>`<article class="card"><div class="cardbody"><span class="pill">${esc(c.branch)} • ${esc(c.semester)}</span><h3>${esc(c.title)}</h3><p>₹${c.price}</p><button class="btn ghost" onclick="delCourse('${c._id}')">Delete</button></div></article>`).join('');document.querySelector('#courseSelect').innerHTML=cs.map(c=>`<option value="${c._id}">${esc(c.title)}</option>`).join('')}async function approve(id,status){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}async function delCourse(id){if(confirm('Delete course?')){await api('/api/admin/courses/'+id,{method:'DELETE'});load()}}document.querySelector('#courseForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/courses',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()};document.querySelector('#contentForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/content',{method:'POST',credentials:'include',body:new FormData(e.target)});const d=await r.json();if(!r.ok)alert(d.error);else{alert('Content saved');e.target.reset()}};boot()</script></body></html>
