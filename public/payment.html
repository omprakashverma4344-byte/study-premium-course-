<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — STUDY PREMIUM COURSE</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="nav"><div class="container" style="width:100%"><a class="brand" href="/">STUDY <span>PREMIUM COURSE</span></a></div></header><main class="section"><div class="container"><div class="hero-card"><h1>Secure Batch Purchase</h1><p class="muted">Pay using the displayed UPI/QR, then submit the UTR. Access is never unlocked by the browser alone.</p><div id="courseInfo" class="notice"></div><div class="qr" style="margin:18px 0"><div><h3>UPI / QR PAYMENT</h3><p id="upi">Configure UPI_ID in .env</p><div class="notice">Add your real QR image as <code>public/qr-payment.jpeg</code> and replace this box in production.</div></div></div><form id="form" class="form"><input class="input" name="name" placeholder="Full name" required><input class="input" type="email" name="email" placeholder="Email" required><input class="input" name="mobile" placeholder="Mobile number"><input class="input" name="utr" placeholder="UTR / Transaction ID" required><button class="btn">Submit Payment Proof</button></form><div id="msg" class="notice" style="display:none;margin-top:14px"></div></div></div></main><script src="/assets/app.js"></script><script>const courseId=new URLSearchParams(location.search).get('course');let course; (async()=>{course=await api('/api/courses/'+courseId);document.querySelector('#courseInfo').innerHTML='<b>'+esc(course.title)+'</b><br><span class="muted">Amount: ₹'+course.price+'</span>';const c=await api('/api/config');document.querySelector('#upi').textContent=c.upiId?`${c.upiId} • ${c.upiName}`:'UPI not configured';})();document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));body.courseId=courseId;try{const r=await api('/api/orders',{method:'POST',body:JSON.stringify(body)});document.querySelector('#msg').style.display='block';document.querySelector('#msg').textContent=r.message+' Order ID: '+r.orderId;e.target.reset()}catch(err){document.querySelector('#msg').style.display='block';document.querySelector('#msg').textContent=err.message}}</script></body></html>
