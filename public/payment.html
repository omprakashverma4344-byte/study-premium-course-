<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase — STUDY PREMIUM COURSE</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="nav"><div class="container" style="width:100%"><a class="brand" href="/">STUDY <span>PREMIUM COURSE</span></a></div></header><main class="section"><div class="container"><div class="hero-card"><span class="pill">💳 SECURE PURCHASE</span><h1>Complete Your Purchase</h1><div id="courseInfo" class="notice">Loading course...</div><div class="qr" style="margin:18px 0"><h3>QR PAYMENT / UPI</h3><div id="upi">Loading payment details...</div><img id="qrImage" src="/qr-payment.jpeg" alt="UPI QR" style="display:none;max-width:260px;border-radius:16px;margin-top:12px"></div><form id="form" class="form" enctype="multipart/form-data"><input class="input" name="name" placeholder="Full Name" required><input class="input" name="email" type="email" placeholder="Email Address" required><input class="input" name="mobile" placeholder="Mobile Number"><input class="input" name="utr" placeholder="UTR / Transaction ID" required><label class="muted">Payment Screenshot (optional)<input class="input" name="paymentProof" type="file" accept="image/*"></label><button class="btn">Submit Payment</button></form><div id="msg" class="notice" style="display:none;margin-top:14px"></div><p class="muted">Your payment will be verified by admin. Access is unlocked only after approval.</p></div></div></main><script src="/assets/app.js"></script><script>const courseId=new URLSearchParams(location.search).get('course');let course;(async()=>{try{course=await api('/api/courses/'+courseId);document.querySelector('#courseInfo').innerHTML='<b>'+esc(course.title)+'</b><br><span class="muted">'+esc(course.batch||'')+' • '+esc(course.branch||'')+' • '+esc(course.semester||'')+'</span><br><strong class="price">₹'+course.price+'</strong>';const c=await api('/api/config');document.querySelector('#upi').textContent=c.upiId?c.upiId+' • '+c.upiName:'UPI not configured';const img=document.querySelector('#qrImage');img.onload=()=>img.style.display='block';img.onerror=()=>{};img.src='/qr-payment.jpeg?'+Date.now()}catch(e){document.querySelector('#courseInfo').textContent=e.message}})();document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);fd.append('courseId',courseId);try{const r=await fetch('/api/orders',{method:'POST',credentials:'include',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Payment submission failed');document.querySelector('#msg').style.display='block';document.querySelector('#msg').textContent=d.message+' Order ID: '+d.orderId;e.target.reset()}catch(err){document.querySelector('#msg').style.display='block';document.querySelector('#msg').textContent=err.message}}</script></body></html>
