<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course — STUDY PREMIUM COURSE</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="nav"><div class="container" style="width:100%;display:flex;justify-content:space-between;align-items:center"><a class="brand" href="/">STUDY <span>PREMIUM COURSE</span></a><nav class="navlinks"><a href="courses.html">Courses</a><a href="account.html">My Account</a></nav></div></header><main class="section"><div class="container"><div id="course"></div></div></main><div class="toast"></div><script src="/assets/app.js"></script><script>const id=new URLSearchParams(location.search).get('id');(async()=>{const c=await api('/api/courses/'+id);document.querySelector('#course').innerHTML=`<div class="hero-card">${c.thumbnail?`<img class="course-hero-thumb" src="${esc(c.thumbnail)}" alt="${esc(c.title)}">`:''}<span class="pill">${esc(c.branch||'Course')} • ${esc(c.semester||'')}</span><h1>${esc(c.title)}</h1><p class="muted">${esc(c.description||'')}</p><div class="row"><span class="price">₹${c.price}</span><a class="btn" href="payment.html?course=${c._id}">BUY / GET ACCESS</a></div></div><section class="section"><h2>Course structure</h2><div class="grid"><div class="card"><div class="cardbody"><b>Folders</b><p class="muted">Semester → Batch → Subjects → Units</p></div></div><div class="card"><div class="cardbody"><b>Video classes</b><p class="muted">Protected playback through server access.</p></div></div><div class="card"><div class="cardbody"><b>Notes & PDFs</b><p class="muted">Private storage and controlled downloads.</p></div></div></div></section>`})().catch(e=>document.querySelector('#course').innerHTML='<div class="notice">'+esc(e.message)+'</div>')</script></body></html>
