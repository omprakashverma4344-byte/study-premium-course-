<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Content — STUDY PREMIUM COURSE</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="nav"><div class="container" style="width:100%"><a class="brand" href="/">STUDY <span>PREMIUM COURSE</span></a></div></header><main class="section"><div class="container"><span class="pill">🔐 PURCHASED CONTENT</span><h1>Course Content</h1><p class="muted">Every Play / PDF / Save action is verified by the backend and delivered through Telegram.</p><div id="list" class="content-list"></div></div></main><script src="/assets/app.js"></script><script>const id=new URLSearchParams(location.search).get('course');(async()=>{try{const items=await api('/api/courses/'+id+'/content');document.querySelector('#list').innerHTML=items.map(x=>`<div class="content-item"><span class="pill">${esc(x.type)}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.subject)} • ${esc(x.unit)}</p><div class="row"><button class="btn" onclick="openTelegram('${x._id}','play')">▶ PLAY</button>${x.type==='pdf'?'<button class="btn ghost" onclick="openTelegram(\''+x._id+'\',\'pdf\')">📄 PDF</button>':''}<button class="btn ghost" onclick="openTelegram('${x._id}','save')">⬇ SAVE</button></div></div>`).join('')||'<p class="muted">No content available.</p>'}catch(e){document.querySelector('#list').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}})();async function openTelegram(contentId,action){try{const r=await api('/api/telegram/link/'+id+'/'+contentId+'/'+action);if(!r.url)throw Error('Telegram bot is not configured');location.href=r.url}catch(e){alert(e.message)}}</script></body></html>
