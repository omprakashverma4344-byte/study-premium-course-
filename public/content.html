<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Content</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="nav"><div class="container" style="width:100%"><a class="brand" href="/">STUDY <span>PREMIUM COURSE</span></a></div></header><main class="section"><div class="container"><h1>Course Content</h1><div id="list" class="content-list"></div></div></main><script src="/assets/app.js"></script><script>const id=new URLSearchParams(location.search).get('course');(async()=>{try{const items=await api('/api/courses/'+id+'/content');document.querySelector('#list').innerHTML=items.map(x=>`<div class="content-item"><span class="pill">${esc(x.type)}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.subject)} • ${esc(x.unit)}</p><button class="btn" onclick="openItem('${x._id}','${x.type}')">${x.type==='pdf'?'OPEN PDF':x.type==='video'?'PLAY':'OPEN'}</button></div>`).join('')}catch(e){document.querySelector('#list').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}})();async function openItem(i,t){try{const r=await api('/api/content/'+i+'/access');if(t==='video')window.open(r.url,'_blank');else window.open(r.url,'_blank')}catch(e){alert(e.message)}}</script></body></html>
